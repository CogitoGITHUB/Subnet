# pm-specs: browse package declarations. Read-only: nothing here
# writes a file or changes the machine. PM_ROOT must point at the
# AIU-PM checkout; PM_SPECS optionally overrides the specs directory
# (default: the repo's own docs/examples).

[metadata]
name = "pm-specs"
description = "Browse pm package declarations with check verdicts"
requirements = ["nu", "racket"]

[source]
command = "ls ($env.PM_SPECS | default (($env.PM_ROOT | path join docs examples)))/*.rktd | get name"
shell = "nu"
display = "{split:/:-1}"

[preview]
command = ["open {}", "^racket ([$env.PM_ROOT cli main.rkt] | path join) check (($env.PM_SPECS | default (($env.PM_ROOT | path join docs examples))))"]
shell = "nu"

[ui.preview_panel]
size = 55
header = "{}"

[keybindings]
shortcut = "f2"
ctrl-e = "actions:check-dir"

[actions.check-dir]
description = "Validate every spec in the specs directory, then return"
command = "^racket ([$env.PM_ROOT cli main.rkt] | path join) check (($env.PM_SPECS | default (($env.PM_ROOT | path join docs examples))))"
shell = "nu"
mode = "fork"

[package]
name = "multiplexer"
version = "0.1.0"
edition = "2021"
publish = false

# Two programs, two crates: the holder holds the session and the client is a
# thin screen that attaches to it. They do not share code, because the area
# order puts client above holder and a dependency may only point downward.

[[bin]]
name = "holder"
path = "src/holder/holder.rs"

[[bin]]
name = "client"
path = "src/client/client.rs"

[[bin]]
name = "mux-mcp"
path = "src/agents/mcp.rs"

# The bake, run by hand: the devloop area is below the client and the holder,
# and the command is its only surface.
[[bin]]
name = "mux-bake"
path = "src/devloop/bake_command.rs"

[dependencies]
# The only two crates this phone can fetch: the offline registry cache holds
# nothing else (see AIU-ECOSYSTEM/WHEN-ON-LAPTOP.org).
libc = "0.2"
serde_json = "1.0"
# The shared read-only Git layer, by path: one Git model for this program
# and for the editor, so the two cannot disagree about what Git says.
git-inspection = { path = "../../shared-layers/git-inspection" }
# The shared workspace engine, by path: one workspace, one set of projects
# and one context for this program and for the editor, so the two cannot
# disagree about what the work is.
workspace = { path = "../../shared-layers/workspace" }

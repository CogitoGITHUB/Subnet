[package]
name = "workspace"
version = "0.1.0"
edition = "2021"
publish = false

# The workspace engine: one model, one store, one set of operations.
#
# It is a library first, so the multiplexer uses it inside its own process,
# and a program second, so the editor can reach it over the join seam that
# already carries the two languages (D-008).

[lib]
name = "workspace"
path = "src/lib.rs"

[[bin]]
name = "workspace"
path = "src/bin/workspace.rs"

[dependencies]
# The same two crates the multiplexer already fetches: the phone's offline
# registry holds nothing else (see AIU-ECOSYSTEM/WHEN-ON-LAPTOP.org).
libc = "0.2"
serde_json = "1.0"
